name: Compatibility

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.10', '3.14']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -B -m unittest discover -s tests -v
      - run: python skills/paper-replication-archive/scripts/lint_skill.py
      - run: python scripts/package_release.py --output dist
      - run: python scripts/install_skill.py --action update --source . --target .install-smoke/paper-replication-archive
      - run: python scripts/install_skill.py --action check --source . --target .install-smoke/paper-replication-archive
      - run: python .install-smoke/paper-replication-archive/scripts/runtime_control.py --help
      - run: python scripts/install_skill.py --action uninstall --target .install-smoke/paper-replication-archive
